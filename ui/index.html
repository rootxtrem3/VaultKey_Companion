<!doctype html>
<!--
  VaultKey Companion - sample UI (single file, no dependencies)

  Two modes:

  1. Demo mode (default when opened directly in a browser)
     A simulated device with seeded entries. All actions run against an
     in-memory backend that mirrors the session protocol shapes. It is a
     design/interaction sample, not a real device connection.

  2. WebView2 host mode
     If window.chrome.webview exists, the page posts the exact session
     request object:
       {id, method, params, timeout_ms}
     The host writes it as one JSON line to `vaultkey session` stdin and
     forwards every stdout line back verbatim:
       {type:"response", id, ok:true, result}
       {type:"response", id, ok:false, error:{kind,code,message,hint,exit_code,...}}
       {type:"event", event:"ready"|"status"|"watch_error"|"disconnected"|"fatal", ...}
     Process lifecycle is host-owned. The page asks the host to stop with:
       {kind:"vaultkey.control", action:"disconnect"}
     A host that already has a session running should replay `ready` to a
     page that attaches later.

  Limits and error codes mirror firmware protocol v1 and the CLI contract.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VaultKey Companion</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b1015;
    --bg-soft: #0f161d;
    --panel: #131b23;
    --panel-2: #18222c;
    --panel-3: #1e2a35;
    --border: #24313d;
    --border-strong: #314251;
    --text: #e7eef5;
    --muted: #93a1b1;
    --dim: #6d7c8c;
    --accent: #36c6a7;
    --accent-soft: rgba(54, 198, 167, 0.14);
    --blue: #4aa8e0;
    --blue-soft: rgba(74, 168, 224, 0.14);
    --warn: #e3ad55;
    --warn-soft: rgba(227, 173, 85, 0.14);
    --danger: #ec6f7b;
    --danger-soft: rgba(236, 111, 123, 0.14);
    --ok: #55cf92;
    --shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    --radius: 14px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background:
      radial-gradient(1100px 500px at 85% -10%, rgba(54, 198, 167, 0.08), transparent 60%),
      radial-gradient(900px 420px at -10% 100%, rgba(74, 168, 224, 0.07), transparent 60%),
      var(--bg);
    color: var(--text);
    font: 14px/1.55 ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  .app {
    display: grid;
    grid-template-columns: 268px minmax(0, 1fr);
    min-height: 100vh;
  }

  /* ---------- sidebar ---------- */

  .sidebar {
    position: sticky;
    top: 0;
    display: flex;
    flex-direction: column;
    gap: 18px;
    height: 100vh;
    padding: 22px 16px 18px;
    border-right: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(19, 27, 35, 0.86), rgba(11, 16, 21, 0.92));
    backdrop-filter: blur(6px);
  }

  .brand { display: flex; align-items: center; gap: 11px; padding: 2px 6px 0; }

  .brand-mark {
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    border-radius: 11px;
    background: linear-gradient(140deg, var(--accent), #228a9b);
    color: #05110f;
    font-weight: 800;
    letter-spacing: 0.5px;
    box-shadow: 0 6px 18px rgba(54, 198, 167, 0.28);
  }

  .brand-name { font-weight: 650; letter-spacing: 0.2px; }
  .brand-sub { color: var(--dim); font-size: 11.5px; letter-spacing: 0.4px; text-transform: uppercase; }

  .device-mini {
    padding: 12px 13px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel);
  }

  .device-mini .line { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .device-mini .port { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
  .device-mini .product { font-weight: 600; font-size: 13px; margin-top: 6px; }
  .device-mini .status { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; margin-top: 6px; }

  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px rgba(85, 207, 146, 0.12); }
  .dot.warn { background: var(--warn); box-shadow: 0 0 0 3px rgba(227, 173, 85, 0.12); }
  .dot.bad { background: var(--danger); box-shadow: 0 0 0 3px rgba(236, 111, 123, 0.12); }

  .nav { display: flex; flex-direction: column; gap: 4px; margin-top: 2px; }

  .nav button {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px 11px;
    border: 1px solid transparent;
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    text-align: left;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .nav button svg { width: 17px; height: 17px; flex: none; opacity: 0.9; }
  .nav button:hover { background: var(--panel); color: var(--text); }
  .nav button[aria-current="page"] {
    background: var(--accent-soft);
    border-color: rgba(54, 198, 167, 0.28);
    color: var(--text);
  }
  .nav button[aria-current="page"] svg { color: var(--accent); }

  .nav .kbd {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--dim);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 5px;
  }

  .sidebar-footer { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }

  .lock-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    background: var(--panel-2);
    color: var(--text);
    font-weight: 600;
    transition: border-color 0.15s ease, background 0.15s ease, opacity 0.15s ease;
  }
  .lock-btn:hover:not(:disabled) { border-color: var(--danger); background: var(--danger-soft); }
  .lock-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .lock-btn svg { width: 15px; height: 15px; }

  .build { color: var(--dim); font-size: 11px; text-align: center; line-height: 1.5; }

  /* ---------- main ---------- */

  main { width: 100%; max-width: 1160px; margin: 0 auto; padding: 26px 30px 90px; }

  .topbar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }

  .title h1 { margin: 0; font-size: 23px; letter-spacing: -0.2px; font-weight: 650; }
  .title p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.2px;
    white-space: nowrap;
  }
  .badge.ok { color: var(--ok); border-color: rgba(85, 207, 146, 0.3); background: var(--accent-soft); }
  .badge.warn { color: var(--warn); border-color: rgba(227, 173, 85, 0.3); background: var(--warn-soft); }
  .badge.bad { color: var(--danger); border-color: rgba(236, 111, 123, 0.3); background: var(--danger-soft); }
  .badge.blue { color: var(--blue); border-color: rgba(74, 168, 224, 0.3); background: var(--blue-soft); }
  .badge .dot { width: 6px; height: 6px; }

  select.input { padding-right: 26px; }

  /* ---------- primitives ---------- */

  .input {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--bg-soft);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(54, 198, 167, 0.12); }
  .input::placeholder { color: var(--dim); }
  textarea.input { min-height: 92px; resize: vertical; font-family: var(--mono); font-size: 12.5px; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 14px;
    border: 1px solid var(--border-strong);
    border-radius: 9px;
    background: var(--panel-2);
    color: var(--text);
    font-weight: 600;
    font-size: 13px;
    transition: background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease, transform 0.05s ease;
    white-space: nowrap;
  }
  .btn:hover:not(:disabled) { border-color: var(--muted); background: var(--panel-3); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn svg { width: 15px; height: 15px; }

  .btn-primary { background: var(--accent); border-color: transparent; color: #041310; }
  .btn-primary:hover:not(:disabled) { background: #45d6b6; border-color: transparent; }

  .btn-danger { background: var(--danger-soft); border-color: rgba(236, 111, 123, 0.4); color: #ffb4bb; }
  .btn-danger:hover:not(:disabled) { background: rgba(236, 111, 123, 0.22); border-color: var(--danger); }

  .btn-ghost { background: transparent; border-color: var(--border); }
  .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
  .btn-sm svg { width: 13px; height: 13px; }

  .card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: linear-gradient(180deg, rgba(24, 34, 44, 0.72), rgba(19, 27, 35, 0.9));
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.02) inset;
  }

  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--border);
  }
  .card-head h2 { margin: 0; font-size: 14.5px; font-weight: 650; letter-spacing: 0.1px; }
  .card-body { padding: 18px; }

  .muted { color: var(--muted); }
  .dim { color: var(--dim); }
  .mono { font-family: var(--mono); }
  .small { font-size: 12px; }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--muted);
    white-space: nowrap;
  }
  .pill.ok { color: var(--ok); border-color: rgba(85, 207, 146, 0.3); background: var(--accent-soft); }
  .pill.warn { color: var(--warn); border-color: rgba(227, 173, 85, 0.3); background: var(--warn-soft); }
  .pill.bad { color: var(--danger); border-color: rgba(236, 111, 123, 0.3); background: var(--danger-soft); }

  /* ---------- overview ---------- */

  .hero {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 20px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: "";
    position: absolute;
    inset: -60% -20% auto auto;
    width: 420px;
    height: 300px;
    background: radial-gradient(closest-side, rgba(54, 198, 167, 0.14), transparent);
    pointer-events: none;
  }
  .hero-main { display: flex; align-items: center; gap: 15px; min-width: 0; }
  .orb {
    display: grid;
    place-items: center;
    width: 54px;
    height: 54px;
    border-radius: 15px;
    border: 1px solid rgba(54, 198, 167, 0.35);
    background: linear-gradient(145deg, rgba(54, 198, 167, 0.2), rgba(19, 27, 35, 0.6));
    font-weight: 800;
    color: var(--accent);
    letter-spacing: 0.5px;
    flex: none;
  }
  .hero h2 { margin: 0; font-size: 18px; font-weight: 650; }
  .hero h2 span { color: var(--muted); font-weight: 500; }
  .hero p { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; }
  .hero-badges { display: flex; gap: 8px; flex-wrap: wrap; position: relative; z-index: 1; }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .stat { padding: 14px 16px; }
  .stat .label { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.7px; font-weight: 650; }
  .stat .value { margin-top: 7px; font-size: 16px; font-weight: 620; display: flex; align-items: center; gap: 8px; }
  .stat .sub { margin-top: 4px; color: var(--muted); font-size: 12px; }

  .split { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; }

  .summary-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--border); }
  .summary-row:last-child { border-bottom: 0; }
  .summary-row .name { display: flex; align-items: center; gap: 10px; }
  .summary-row .count { font-family: var(--mono); font-size: 18px; font-weight: 650; }

  .mini-icon {
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    border-radius: 9px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    flex: none;
  }
  .mini-icon svg { width: 16px; height: 16px; }

  .demo-list { display: flex; flex-direction: column; gap: 8px; }
  .demo-list .btn { justify-content: flex-start; }

  /* ---------- entries ---------- */

  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }

  .tabs { display: flex; gap: 4px; padding: 3px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-soft); }
  .tabs button {
    padding: 6px 12px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 600;
  }
  .tabs button[aria-selected="true"] { background: var(--panel-3); color: var(--text); box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset; }
  .tabs .n { font-family: var(--mono); color: var(--dim); margin-left: 5px; font-weight: 500; }

  .search { width: 260px; max-width: 100%; }

  .notice {
    display: flex;
    gap: 9px;
    align-items: flex-start;
    padding: 11px 16px;
    border-bottom: 1px solid var(--border);
    background: rgba(74, 168, 224, 0.05);
    color: var(--muted);
    font-size: 12.5px;
  }
  .notice svg { width: 15px; height: 15px; flex: none; color: var(--blue); margin-top: 1px; }

  .table { width: 100%; border-collapse: collapse; }
  .table th {
    text-align: left;
    padding: 10px 16px;
    color: var(--dim);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    font-weight: 650;
    border-bottom: 1px solid var(--border);
  }
  .table td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .table tr:last-child td { border-bottom: 0; }
  .table tbody tr:hover { background: rgba(255, 255, 255, 0.017); }
  .table .id { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .table .label-cell { font-weight: 600; }
  .table .actions { display: flex; gap: 6px; justify-content: flex-end; }

  .type-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 650;
    border: 1px solid var(--border);
    color: var(--muted);
    background: var(--panel-2);
  }
  .type-badge.cred { color: var(--blue); border-color: rgba(74, 168, 224, 0.28); background: var(--blue-soft); }
  .type-badge.totp { color: var(--warn); border-color: rgba(227, 173, 85, 0.28); background: var(--warn-soft); }

  .pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--border); }
  .pager .range { color: var(--muted); font-size: 12px; }

  .empty { padding: 44px 24px; text-align: center; color: var(--muted); }
  .empty .icon { display: grid; place-items: center; width: 44px; height: 44px; margin: 0 auto 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel-2); }
  .empty .icon svg { width: 20px; height: 20px; color: var(--dim); }
  .empty h3 { margin: 0 0 6px; color: var(--text); font-size: 15px; font-weight: 620; }
  .empty p { margin: 0 auto 14px; max-width: 420px; font-size: 13px; }
  .empty .btn { margin-top: 2px; }

  /* ---------- forms ---------- */

  .form { display: grid; gap: 16px; padding: 20px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field.full { grid-column: 1 / -1; }
  .field label { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--text); }
  .field label .req { color: var(--danger); font-weight: 700; margin-left: 2px; }
  .field .count { font-family: var(--mono); font-size: 11px; color: var(--dim); font-weight: 500; }
  .field .count.over { color: var(--danger); }
  .hint { color: var(--dim); font-size: 11.5px; }
  .form-actions { display: flex; align-items: center; gap: 10px; padding-top: 4px; flex-wrap: wrap; }
  .form-note { flex: 1; min-width: 200px; color: var(--muted); font-size: 12px; }

  .warn-line { display: none; align-items: center; gap: 7px; color: var(--warn); font-size: 12px; }
  .warn-line.show { display: flex; }

  .pw-wrap { position: relative; }
  .pw-wrap .input { padding-right: 64px; }
  .pw-toggle {
    position: absolute;
    top: 50%;
    right: 6px;
    transform: translateY(-50%);
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 600;
    padding: 4px 6px;
    border-radius: 5px;
  }
  .pw-toggle:hover { color: var(--text); background: var(--panel-3); }

  /* ---------- activity ---------- */

  .activity-list { display: flex; flex-direction: column; }
  .activity-item { display: grid; grid-template-columns: 76px 1fr auto; gap: 12px; padding: 10px 18px; border-bottom: 1px solid var(--border); font-size: 12.5px; align-items: center; }
  .activity-item:last-child { border-bottom: 0; }
  .activity-item time { color: var(--dim); font-family: var(--mono); font-size: 11.5px; }
  .activity-item .method { font-family: var(--mono); font-size: 12px; }
  .activity-item .note { color: var(--muted); margin-top: 1px; }

  /* ---------- toasts ---------- */

  #toasts { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 9px; z-index: 80; width: min(380px, calc(100vw - 40px)); }

  .toast {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 12px 14px;
    border-radius: 11px;
    border: 1px solid var(--border-strong);
    background: rgba(24, 34, 44, 0.97);
    box-shadow: var(--shadow);
    animation: toast-in 0.18s ease-out;
  }
  .toast .dot { margin-top: 5px; }
  .toast .text { min-width: 0; font-size: 12.5px; }
  .toast .text strong { display: block; font-size: 12.5px; }
  .toast .text span { color: var(--muted); }
  .toast.ok { border-color: rgba(85, 207, 146, 0.35); }
  .toast.warn { border-color: rgba(227, 173, 85, 0.35); }
  .toast.bad { border-color: rgba(236, 111, 123, 0.4); }
  @keyframes toast-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ---------- modal ---------- */

  .overlay {
    position: fixed;
    inset: 0;
    z-index: 70;
    display: grid;
    place-items: center;
    padding: 20px;
    background: rgba(4, 8, 12, 0.62);
    backdrop-filter: blur(3px);
  }
  .modal { width: min(560px, 100%); max-height: calc(100vh - 40px); overflow: auto; border: 1px solid var(--border-strong); border-radius: 15px; background: var(--panel); box-shadow: var(--shadow); }
  .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--border); }
  .modal-head h2 { margin: 0; font-size: 16px; font-weight: 650; }
  .modal-head p { margin: 3px 0 0; color: var(--muted); font-size: 12.5px; }
  .modal-body { padding: 18px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 9px; padding: 14px 18px; border-top: 1px solid var(--border); }
  .icon-btn { display: grid; place-items: center; width: 30px; height: 30px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: var(--muted); }
  .icon-btn:hover { color: var(--text); background: var(--panel-3); }
  .icon-btn svg { width: 15px; height: 15px; }
  .danger-box { display: flex; gap: 10px; padding: 12px; border: 1px solid rgba(236, 111, 123, 0.32); border-radius: 10px; background: var(--danger-soft); color: #ffc3c9; font-size: 12.5px; }
  .danger-box svg { width: 17px; height: 17px; flex: none; margin-top: 1px; }

  /* ---------- responsive ---------- */

  @media (max-width: 980px) {
    .split { grid-template-columns: 1fr; }
    .stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--border); }

<script>
"use strict";

/* ======================================================================
   Contract constants (mirror internal/vaultkey/types.go)
   ====================================================================== */

const LIMITS = Object.freeze({
  service: 64, username: 128, password: 256, url: 192, notes: 512,
  query: 64, totp_uri: 1024, request_line: 2048,
  page_limit: 25, page_offset: 256,
  credentials: 128, totp: 128
});

const PAGE_SIZE = 8;
const AUTH_WINDOW_MS = 5 * 60 * 1000;

const VIEW_META = {
  overview: ["Overview", "Device state and quick actions"],
  entries: ["Entries", "Labels exposed by the device; secrets are never listed"],
  add: ["Add credential", "Write a new entry over CDC"],
  totp: ["TOTP", "Import an otpauth:// URI"],
  activity: ["Activity", "Local session log (secrets are never recorded)"]
};

/* ======================================================================
   State
   ====================================================================== */

const state = {
  mode: (window.chrome && window.chrome.webview) ? "webview" : "demo",
  view: "overview",
  connected: false,
  busy: false,
  port: "",
  device: null,
  status: null,
  clock: null,
  list: null,
  query: "",
  tab: "all",
  offsets: { all: 0, credential: 0, totp: 0 },
  activity: []
};

/* ======================================================================
   Demo backend
   ====================================================================== */

const demo = {
  device: { product: "VaultKey", firmware: "1.0.0", hardware: "rev-D", protocol: 1 },
  port: "COM5",
  locked: false,
  authUntil: Date.now() + AUTH_WINDOW_MS - 12 * 1000,
  rtc: "ok",
  credentials: [
    { id: 2147483641, service: "GitHub", username: "rootxtrem3" },
    { id: 3881274416, service: "Fastmail", username: "rootx@fastmail.com" },
    { id: 1029384756, service: "Fedora Project", username: "ebafrost" },
    { id: 2749386111, service: "Bank of Example", username: "rootx" },
    { id: 1992837465, service: "Home router", username: "admin" },
    { id: 3218475562, service: "AWS console", username: "rootx-admin" }
  ],
  totp: [
    { id: 1122334455, issuer: "GitHub", account: "rootxtrem3" },
    { id: 2233445566, issuer: "Fastmail", account: "rootx@fastmail.com" },
    { id: 3344556677, issuer: "Proton", account: "rootx" }
  ]
};

function authorized() {
  return !demo.locked && demo.authUntil > Date.now();
}

function demoError(kind, code, message, exitCode, extra) {
  return Object.assign(new Error(message), {
    kind: kind, code: code, message: message, exit_code: exitCode
  }, extra || {});
}

function newID() {
  return Math.floor(Math.random() * 0xfffffffe) + 1;
}

function guardManagement() {
  if (demo.locked) {
    throw demoError("locked", "device_locked", "the device is locked", 4, {
      hint: "unlock the device with its PIN, then retry."
    });
  }
  if (!authorized()) {
    demo.authUntil = 0;
    throw demoError("not_authorized", "provisioning_not_authorized",
      "CDC provisioning is not authorized", 5, {
        hint: 'open USB Functions on the device and choose "Authorize CDC 5 min".'
      });
  }
}

function demoStatus() {
  const status = {
    locked: demo.locked,
    rtc: demo.rtc,
    storage: "ok",
    startup: "ok",
    display: "ok",
    button_event_drops: 0,
    usb_driver: true,
    usb_mounted: true,
    cdc: true,
    hid: true,
    provisioning: authorized()
  };
  if (status.provisioning) {
    status.credentials = demo.credentials.length;
    status.totp = demo.totp.length;
  }
  return status;
}

function parseTOTP(uri) {
  const prefix = "otpauth://totp/";
  if (!uri || uri.slice(0, prefix.length).toLowerCase() !== prefix) return null;
  const queryAt = uri.indexOf("?");
  const rawLabel = queryAt === -1 ? uri.slice(prefix.length) : uri.slice(prefix.length, queryAt);
  let label = rawLabel;
  try { label = decodeURIComponent(rawLabel); } catch (e) { /* keep raw */ }
  const params = new URLSearchParams(queryAt === -1 ? "" : uri.slice(queryAt + 1));
  const colon = label.indexOf(":");
  const labelIssuer = colon === -1 ? "" : label.slice(0, colon).trim();
  const labelAccount = (colon === -1 ? label : label.slice(colon + 1)).trim();
  const issuer = (params.get("issuer") || labelIssuer || "").trim();
  const account = (labelAccount || issuer).trim();
  return { issuer: issuer, account: account };
}

function validateCredential(input) {
  const checks = [
    ["service", input.service, LIMITS.service, true],
    ["username", input.username, LIMITS.username, false],
    ["password", input.password, LIMITS.password, true],
    ["URL", input.url, LIMITS.url, false],
    ["notes", input.notes, LIMITS.notes, false]
  ];
  for (const [name, value, max, required] of checks) {
    const size = byteLength(value);
    if (required && !value) return name + " is required";
    if (size > max) return name + " exceeds " + max + " bytes";
  }
  return null;
}

async function demoCall(method, params) {
  params = params || {};
  await new Promise(function (resolve) { setTimeout(resolve, 110 + Math.random() * 170); });

  switch (method) {
    case "capabilities":
      return capabilities();

    case "hello":
      return { port: demo.port, device: demo.device };

    case "open":
      // Opening a port does not grant authorization. The demo starts with a
      // valid window; after it expires the user must use "Authorize CDC".
      demo.port = (params.port || "COM5").trim() || "COM5";
      return { port: demo.port, device: demo.device };

    case "close":
      // Closing the COM port drops DTR; rev-D revokes CDC provisioning.
      demo.authUntil = 0;
      return { closed: true };

    case "reconnect":
      return demoCall("open", params);

    case "status":
      return demoStatus();

    case "time.get":
      if (demo.rtc !== "ok") {
        throw demoError("device", "rtc_time_invalid", "the RTC time is not valid", 8, {
          hint: "set the clock from the device menu or with time.set."
        });
      }
      return { unix: Math.floor(Date.now() / 1000), utc: true };

    case "time.set":
      demo.rtc = "ok";
      return { unix: Number(params.unix || Math.floor(Date.now() / 1000)), utc: true };

    case "list": {
      guardManagement();
      const query = String(params.query || "").toLowerCase();
      const offset = Math.max(0, Number(params.offset) || 0);
      const limit = Math.min(LIMITS.page_limit, Math.max(1, Number(params.limit) || 20));
      const credentials = demo.credentials
        .filter(function (entry) { return !query || entry.service.toLowerCase().includes(query); })
        .map(function (entry) { return { id: entry.id, service: entry.service }; });
      const totp = demo.totp
        .filter(function (entry) {
          return !query ||
            entry.issuer.toLowerCase().includes(query) ||
            entry.account.toLowerCase().includes(query);
        })
        .map(function (entry) { return { id: entry.id, issuer: entry.issuer, account: entry.account }; });
      return {
        offset: offset, limit: limit,
        credential_total: credentials.length,
        totp_total: totp.length,
        credentials: credentials.slice(offset, offset + limit),
        totp: totp.slice(offset, offset + limit)
      };
    }

    case "credentials.add": {
      guardManagement();
      const input = {
        service: String(params.service || "").trim(),
        username: String(params.username || ""),
        password: String(params.password || ""),
        url: String(params.url || "").trim(),
        notes: String(params.notes || "").trim()
      };
      const problem = validateCredential(input);
      if (problem) throw demoError("usage", "invalid_credential", problem, 2);
      if (demo.credentials.length >= LIMITS.credentials) {
        throw demoError("device", "storage_failed", "the credential store is full", 8);
      }
      const id = newID();
      demo.credentials.push({ id: id, service: input.service, username: input.username });
      return { entry_id: id };
    }

    case "credentials.update": {
      guardManagement();
      const id = Number(params.id) || 0;
      if (!id) throw demoError("usage", "invalid_request", "entry ID must be positive", 2);
      const index = demo.credentials.findIndex(function (entry) { return entry.id === id; });
      if (index === -1) {
        throw demoError("device", "entry_not_found", "the entry was not found", 8);
      }
      const input = {
        service: String(params.service || "").trim(),
        username: String(params.username || ""),
        password: String(params.password || ""),
        url: String(params.url || "").trim(),
        notes: String(params.notes || "").trim()
      };
      const problem = validateCredential(input);
      if (problem) throw demoError("usage", "invalid_credential", problem, 2);
      demo.credentials[index] = { id: id, service: input.service, username: input.username };
      return { entry_id: id };
    }

    case "totp.add": {
      guardManagement();
      const uri = String(params.uri || "");
      if (!uri) throw demoError("usage", "invalid_uri", "URI is required", 2);
      if (byteLength(uri) > LIMITS.totp_uri) {
        throw demoError("usage", "invalid_uri", "URI exceeds 1024 bytes", 2);
      }
      const parsed = parseTOTP(uri);
      if (!parsed || !parsed.account) {
        throw demoError("usage", "invalid_uri", "URI must start with otpauth://totp/", 2);
      }
      if (demo.totp.length >= LIMITS.totp) {
        throw demoError("device", "storage_failed", "the TOTP store is full", 8);
      }
      const id = newID();
      demo.totp.push({ id: id, issuer: parsed.issuer || "—", account: parsed.account });
      return { entry_id: id };
    }

    case "delete": {
      guardManagement();
      const id = Number(params.id) || 0;
      const type = String(params.type || "");
      if (!id || (type !== "credential" && type !== "totp")) {
        throw demoError("usage", "invalid_entry_type", "type must be credential or totp", 2);
      }
      const collection = type === "credential" ? demo.credentials : demo.totp;
      const index = collection.findIndex(function (entry) { return entry.id === id; });
      if (index === -1) throw demoError("device", "entry_not_found", "the entry was not found", 8);
      collection.splice(index, 1);
      return { deleted: true, type: type, entry_id: id };
    }

    case "lock":
      demo.locked = true;
      demo.authUntil = 0;
      return { locked: true };

    default:
      throw demoError("usage", "unknown_method", "unknown method: " + method, 2);
  }
}

/* ======================================================================
   WebView2 bridge
   ====================================================================== */

const live = { nextId: 1, pending: new Map() };

// WebView2 host contract:
//
//   page -> host: exact session request object
//     {id, method, params, timeout_ms}
//   host -> page: session response, forwarded verbatim
//     {type:"response", id, ok:true, result}
//     {type:"response", id, ok:false, error:{kind,code,message,hint,exit_code,...}}
//   host -> page: session events, forwarded verbatim
//     {type:"event", event:"ready"|"status"|"watch_error"|"disconnected"|"fatal", ...}
//   page -> host: lifecycle control, not a session method
//     {kind:"vaultkey.control", action:"disconnect"}
//
// The host writes each request as one JSON line to `vaultkey session` stdin
// and forwards every stdout line. It should replay `ready` to a page that
// attaches after the session started, and keep request order serial.
function liveCall(method, params, timeoutMs) {
  timeoutMs = timeoutMs || 5000;
  return new Promise(function (resolve, reject) {
    const id = live.nextId++;
    const timer = setTimeout(function () {
      live.pending.delete(id);
      reject(demoError("timeout", "timeout", "the request timed out", 7, {
        hint: "check that the session process is still running."
      }));
    }, timeoutMs + 3000);
    live.pending.set(id, { resolve: resolve, reject: reject, timer: timer });
    window.chrome.webview.postMessage({
      id: id,
      method: method,
      params: params || {},
      timeout_ms: timeoutMs
    });
  });
}

function hostControl(action) {
  if (window.chrome && window.chrome.webview) {
    window.chrome.webview.postMessage({ kind: "vaultkey.control", action: action });
  }
}

function handleHostMessage(event) {
  const message = event.data;
  if (!message || typeof message !== "object") return;

  if (message.type === "response") {
    const entry = live.pending.get(message.id);
    if (!entry) return;
    live.pending.delete(message.id);
    clearTimeout(entry.timer);
    if (message.ok) {
      entry.resolve(message.result);
    } else {
      entry.reject(message.error || demoError("protocol", "protocol_error", "invalid host response", 6));
    }
    return;
  }

  if (message.type !== "event") return;

  if (message.event === "ready" && message.result) {
    state.device = message.result.device || state.device;
    state.port = message.result.port || state.port;
    state.connected = true;
    log("session.ready", "ok", state.port);
    refresh(true);
    return;
  }

  if (message.event === "status" && message.result) {
    state.status = message.result.status || state.status;
    if (!state.status.provisioning) state.list = null;
    if (state.view === "overview" || state.view === "entries") render();
    else renderChrome();
    return;
  }

  if (message.event === "watch_error") {
    const detail = message.error && message.error.message;
    log("watch.error", "warn", detail);
    toast("Watch error", "warn", detail);
    return;
  }

  if (message.event === "disconnected" || message.event === "fatal") {
    state.connected = false;
    state.status = null;
    state.clock = null;
    state.list = null;
    log("session." + message.event, "fail", message.error && message.error.message);
    toast(message.event === "fatal" ? "Session failed" : "Device disconnected", "bad",
      message.error && message.error.message);
    render();
  }
}

const api = state.mode === "webview" ? liveCall : demoCall;

/* ======================================================================
   Helpers
   ====================================================================== */

const encoder = new TextEncoder();

function byteLength(value) {
  return encoder.encode(String(value || "")).length;
}

function esc(value) {
  return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
  });
}

function isASCII(value) {
  return /^[\x09\x0A\x0D\x20-\x7E]*$/.test(value);
}

function fmtClock(unix) {
  if (unix == null) return "—";
  const date = new Date(unix * 1000);
  return date.toISOString().slice(0, 19).replace("T", " ") + " UTC";
}

function fmtDuration(ms) {
  const total = Math.max(0, Math.floor(ms / 1000));
  const minutes = Math.floor(total / 60);
  const seconds = total % 60;
  return minutes + ":" + String(seconds).padStart(2, "0");
}

function statusTone(value) {
  if (value === true || value === "ok") return "ok";
  if (value === false || value === "invalid" || value === "error") return "bad";
  return "warn";
}

function capabilities() {
  return {
    session_protocol: 1,
    app: { version: "0.1.0", commit: "sample", build_date: "2026-11-17", platform: state.mode },
    protocol: 1,
    limits: LIMITS,
    methods: ["capabilities", "hello", "status", "time.get", "time.set", "list",
      "credentials.add", "credentials.update", "totp.add", "delete", "lock",
      "watch.start", "watch.stop", "reconnect", "shutdown", "doctor"],
    features: ["sample_ui", "demo_backend", "webview2_bridge"],
    exit_codes: { ok: 0, failure: 1, usage: 2, connection: 3, locked: 4, not_authorized: 5, protocol: 6, ambiguous_or_timeout: 7, device_operation: 8, interrupted: 130 }
  };
}

function log(method, result, note) {
  state.activity.unshift({
    time: new Date(),
    method: method,
    result: result,
    note: note || ""
  });
  if (state.activity.length > 200) state.activity.length = 200;
}

function toast(title, tone, detail) {
  const root = document.getElementById("toasts");
  const node = document.createElement("div");
  node.className = "toast " + (tone || "ok");
  node.innerHTML = '<span class="dot ' + (tone === "bad" ? "bad" : tone === "warn" ? "warn" : "ok") + '"></span>' +
    '<div class="text"><strong>' + esc(title) + "</strong>" +
    (detail ? "<span>" + esc(detail) + "</span>" : "") + "</div>";
  root.appendChild(node);
  setTimeout(function () {
    node.style.opacity = "0";
    node.style.transition = "opacity 0.2s ease";
    setTimeout(function () { node.remove(); }, 220);
  }, 4600);
}

function toastError(error) {
  const hint = error && error.hint ? " " + error.hint : "";
  toast(error && error.message ? error.message : "Request failed", "bad",
    (error && error.code ? error.code : "") + hint);
}

function canManage() {
  return state.connected && state.status && !state.status.locked && state.status.provisioning;
}

/* ======================================================================
   Rendering
   ====================================================================== */

const icons = {
  key: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M17 4l3 3"/></svg>',
  shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l7 3v6c0 4.2-2.9 7.7-7 9-4.1-1.3-7-4.8-7-9V6l7-3z"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13"/></svg>',
  refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12a8 8 0 11-2.3-5.6M20 4v5h-5"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l10 18H2L12 3z"/><path d="M12 9v5M12 17.4v.6"/></svg>'
};

function authPill() {
  if (!state.connected) return '<span class="pill">offline</span>';
  if (!state.status) return '<span class="pill">unknown</span>';
  if (state.status.provisioning) {
    if (state.mode === "demo") {
      return '<span class="pill ok"><span class="dot ok"></span>CDC authorized · <span id="authCountdown">' +
        fmtDuration(demo.authUntil - Date.now()) + "</span></span>";
    }
    return '<span class="pill ok"><span class="dot ok"></span>CDC authorized</span>';
  }
  return '<span class="pill warn"><span class="dot warn"></span>CDC not authorized</span>';
}

function lockPill() {
  if (!state.connected || !state.status) return '<span class="pill">—</span>';
  return state.status.locked
    ? '<span class="pill warn"><span class="dot warn"></span>Vault locked</span>'
    : '<span class="pill ok"><span class="dot ok"></span>Vault unlocked</span>';
}

function statCard(label, value, sub, tone) {
  const dotClass = tone ? "dot " + tone : "dot";
  return '<div class="card stat">' +
    '<div class="label">' + esc(label) + "</div>" +
    '<div class="value"><span class="' + dotClass + '"></span>' + esc(value) + "</div>" +
    '<div class="sub">' + esc(sub) + "</div>" +
    "</div>";
}

function overviewView() {
  if (!state.connected) {
    return '<div class="card empty">' +
      '<div class="icon">' + icons.lock + "</div>" +
      "<h3>No device connected</h3>" +
      "<p>Start the companion session, then connect. On Windows the COM port is exclusive, " +
      "so keep one session open instead of opening the port per command.</p>" +
      '<button class="btn btn-primary" data-action="connect">Connect</button>' +
      "</div>";
  }

  const status = state.status || {};
  const device = state.device || demo.device;
  const credentials = status.credentials;
  const totp = status.totp;
  const authText = status.provisioning ? "management allowed" : "authorize on the device";
  const countsVisible = status.provisioning;

  return "" +
    '<div class="card hero">' +
      '<div class="hero-main">' +
        '<div class="orb">VK</div>' +
        "<div>" +
          "<h2>" + esc(device.product || "VaultKey") + ' <span>' + esc(device.hardware || "") + "</span></h2>" +
          "<p>Firmware " + esc(device.firmware || "—") + " · protocol v" + esc(device.protocol || 1) +
          " · " + esc(state.port || "auto") + " · " + esc(device.product || "") + "</p>" +
        "</div>" +
      "</div>" +
      '<div class="hero-badges">' + lockPill() + authPill() + "</div>" +
    "</div>" +

    '<div class="stat-grid">' +
      statCard("Vault", status.locked ? "Locked" : "Unlocked",
        status.locked ? "management disabled" : "device PIN accepted",
        status.locked ? "warn" : "ok") +
      statCard("CDC authorization", status.provisioning ? "Authorized" : "Not authorized",
        authText, status.provisioning ? "ok" : "warn") +
      statCard("RTC", status.rtc === "ok" ? "Valid" : String(status.rtc || "unknown"),
        state.clock ? fmtClock(state.clock.unix) : "clock unavailable",
        statusTone(status.rtc)) +
      statCard("Storage", String(status.storage || "unknown"),
        "encrypted credential + TOTP store", statusTone(status.storage)) +
      statCard("USB", status.usb_mounted ? "Mounted" : "Not mounted",
        "CDC " + (status.cdc ? "on" : "off") + " · HID " + (status.hid ? "on" : "off"),
        statusTone(status.usb_mounted)) +
      statCard("Entries", countsVisible ? String((credentials || 0) + " / " + (totp || 0)) : "hidden",
        countsVisible ? "credentials / TOTP" : "requires authorization",
        countsVisible ? "ok" : "warn") +
    "</div>" +

    '<div class="split">' +
      '<div class="card">' +
        '<div class="card-head"><h2>Quick actions</h2>' +
          '<span class="pill">' + (status.provisioning ? "ready" : "read-only") + "</span></div>" +
        '<div class="card-body">' +
          '<div class="summary-row"><div class="name"><span class="mini-icon">' + icons.plus + "</span>" +
            "<div><div>Add a credential</div><div class=\"small muted\">Prompt-free form; secrets stay in memory</div></div></div>" +
            '<button class="btn btn-sm" data-action="go-add" ' + (canManage() ? "" : "disabled") + ">Open</button></div>" +
          '<div class="summary-row"><div class="name"><span class="mini-icon">' + icons.shield + "</span>" +
            "<div><div>Import TOTP</div><div class=\"small muted\">otpauth:// URI, validated locally</div></div></div>" +
            '<button class="btn btn-sm" data-action="go-totp" ' + (canManage() ? "" : "disabled") + ">Open</button></div>" +
          '<div class="summary-row"><div class="name"><span class="mini-icon">' + icons.key + "</span>" +
            "<div><div>Browse entries</div><div class=\"small muted\">Device exposes labels only</div></div></div>" +
            '<button class="btn btn-sm" data-action="go-entries" ' + (state.status && state.status.provisioning ? "" : "disabled") + ">Open</button></div>" +
        "</div>" +
      "</div>" +

      '<div class="card">' +
        '<div class="card-head"><h2>' + (state.mode === "demo" ? "Demo controls" : "Host connection") + "</h2>" +
          '<span class="pill ' + (state.mode === "demo" ? "warn" : "ok") + '">' +
          (state.mode === "demo" ? "simulated" : "webview2") + "</span></div>" +
        '<div class="card-body">' +
          (state.mode === "demo"
            ? '<p class="small muted" style="margin:0 0 12px">These buttons simulate the physical device: unlock with the PIN, ' +
              "authorize CDC for five minutes, or unplug the cable.</p>" +
              '<div class="demo-list">' +
                (status.locked
                  ? '<button class="btn btn-sm" data-action="demo-unlock">' + icons.lock + " Simulate unlock (PIN)</button>"
                  : '<button class="btn btn-sm" data-action="demo-authorize">' + icons.shield + " Authorize CDC 5 min</button>") +
                '<button class="btn btn-sm" data-action="demo-expire">' + icons.warn + " Expire authorization</button>" +
                '<button class="btn btn-sm" data-action="demo-unplug">' + icons.close + " Simulate unplug</button>" +
              "</div>"
            : '<p class="small muted" style="margin:0 0 12px">The host owns the session process. This page posts JSON calls to ' +
              "<span class=\"mono\">window.chrome.webview</span> and waits for responses.</p>" +
              '<div class="demo-list">' +
                '<button class="btn btn-sm" data-action="reconnect">' + icons.refresh + " Reconnect</button>" +
                '<button class="btn btn-sm" data-action="goto-activity">View activity</button>' +
              "</div>") +
        "</div>" +
      "</div>" +
    "</div>";
}

function entriesView() {
  if (!state.connected) {
    return '<div class="card empty"><div class="icon">' + icons.key + "</div>" +
      "<h3>Connect to browse entries</h3><p>The device must be unlocked and CDC-authorized.</p>" +
      '<button class="btn btn-primary" data-action="connect">Connect</button></div>';
  }
  if (!state.status || !state.status.provisioning) {
    return '<div class="card empty"><div class="icon">' + icons.lock + "</div>" +
      "<h3>Entries are hidden</h3>" +
      "<p>Unlock the vault on the device and choose <strong>USB Functions → Authorize CDC 5 min</strong>. " +
      "The protocol does not expose entry labels without authorization.</p>" +
      (state.mode === "demo" ? '<button class="btn" data-action="demo-unlock">Simulate unlock + authorize</button>' :
        '<button class="btn" data-action="reconnect">Reconnect</button>') +
      "</div>";
  }

  const list = state.list || { credentials: [], totp: [], credential_total: 0, totp_total: 0 };
  const credTotal = list.credential_total || 0;
  const totpTotal = list.totp_total || 0;
  const offset = state.offsets[state.tab] || 0;
  const total = state.tab === "all" ? credTotal + totpTotal
    : state.tab === "credential" ? credTotal : totpTotal;

  // The "all" tab is fetched completely (see fetchAll) and paged locally so
  // both collections share one row sequence. Single-type tabs are paged by
  // the device with offset/limit.
  const credentials = state.tab === "all"
    ? list.credentials.slice(offset, offset + PAGE_SIZE)
    : list.credentials;
  const totp = state.tab === "all"
    ? list.totp.slice(Math.max(0, offset - credTotal), Math.max(0, offset + PAGE_SIZE - credTotal))
    : list.totp;
  const rows = [];

  if (state.tab === "all" || state.tab === "credential") {
    credentials.forEach(function (entry) {
      rows.push(
        "<tr>" +
          '<td><span class="type-badge cred">credential</span></td>' +
          '<td class="label-cell">' + esc(entry.service) + "</td>" +
          '<td class="mono id">' + esc(entry.id) + "</td>" +
          '<td><div class="actions">' +
            '<button class="btn btn-sm" data-action="replace" data-id="' + entry.id + '" data-label="' + esc(entry.service) + '">Replace…</button>' +
            '<button class="btn btn-sm btn-danger" data-action="delete" data-type="credential" data-id="' + entry.id + '" data-label="' + esc(entry.service) + '">Delete</button>' +
          "</div></td>" +
        "</tr>"
      );
    });
  }
  if (state.tab === "all" || state.tab === "totp") {
    totp.forEach(function (entry) {
      rows.push(
        "<tr>" +
          '<td><span class="type-badge totp">totp</span></td>' +
          '<td class="label-cell">' + esc(entry.issuer) + ' <span class="muted small">· ' + esc(entry.account) + "</span></td>" +
          '<td class="mono id">' + esc(entry.id) + "</td>" +
          '<td><div class="actions">' +
            '<button class="btn btn-sm btn-danger" data-action="delete" data-type="totp" data-id="' + entry.id + '" data-label="' + esc(entry.issuer + " / " + entry.account) + '">Delete</button>' +
          "</div></td>" +
        "</tr>"
      );
    });
  }

  const start = total === 0 ? 0 : offset + 1;
  const end = Math.min(offset + PAGE_SIZE, total);

  return '<div class="card">' +
    '<div class="toolbar">' +
      '<div class="tabs" role="tablist">' +
        '<button role="tab" data-action="tab" data-tab="all" aria-selected="' + (state.tab === "all") + '">All <span class="n">' + total + "</span></button>" +
        '<button role="tab" data-action="tab" data-tab="credential" aria-selected="' + (state.tab === "credential") + '">Credentials <span class="n">' + (list.credential_total || 0) + "</span></button>" +
        '<button role="tab" data-action="tab" data-tab="totp" aria-selected="' + (state.tab === "totp") + '">TOTP <span class="n">' + (list.totp_total || 0) + "</span></button>" +
      "</div>" +
      '<input class="input search" id="search" placeholder="Search labels (max 64 bytes)" value="' + esc(state.query) + '" aria-label="Search entries">' +
    "</div>" +
    '<div class="notice">' + icons.info +
      "<span>The firmware returns only labels (service, TOTP issuer/account). Usernames, URLs, notes, and secrets cannot be read back, so Replace starts blank and overwrites every field.</span>" +
    "</div>" +
    (rows.length === 0
      ? '<div class="empty"><div class="icon">' + icons.key + "</div><h3>No entries" +
        (state.query ? " match this search" : "") + "</h3><p>" +
        (state.query ? "Try a different label or clear the search." : "Add a credential or import a TOTP URI to get started.") +
        "</p></div>"
      : '<table class="table"><thead><tr><th style="width:120px">Type</th><th>Label</th>' +
        '<th style="width:130px">Entry ID</th><th style="width:190px"></th></tr></thead><tbody>' +
        rows.join("") + "</tbody></table>") +
    '<div class="pager">' +
      '<span class="range">' + (total === 0 ? "No entries" : start + "–" + end + " of " + total) + "</span>" +
      '<div class="controls">' +
        '<button class="btn btn-sm" data-action="prev-page" ' + (offset > 0 ? "" : "disabled") + ">Previous</button>" +
        '<button class="btn btn-sm" data-action="next-page" ' + (offset + PAGE_SIZE < total ? "" : "disabled") + ">Next</button>" +
      "</div>" +
    "</div>" +
  "</div>";
}

function fieldCounter(name, max) {
  return '<span class="count" data-count="' + name + '">0 / ' + max + "</span>";
}

function render() {
  const active = document.activeElement;
  const activeId = active && active.id ? active.id : null;
  const caret = activeId && typeof active.selectionStart === "number" ? active.selectionStart : null;

  const meta = VIEW_META[state.view] || VIEW_META.overview;
  document.getElementById("viewTitle").textContent = meta[0];
  document.getElementById("viewSub").textContent = meta[1];

  let html = "";
  if (state.view === "overview") html = overviewView();
  else if (state.view === "entries") html = entriesView();
  else if (state.view === "add") html = addView();
  else if (state.view === "totp") html = totpView();
  else html = activityView();

  document.getElementById("view").innerHTML = html;

  document.querySelectorAll(".nav button").forEach(function (button) {
    if (button.dataset.view === state.view) button.setAttribute("aria-current", "page");
    else button.removeAttribute("aria-current");
  });

  renderChrome();

  if (activeId) {
    const restored = document.getElementById(activeId);
    if (restored && restored.focus) {
      restored.focus();
      if (caret != null && restored.setSelectionRange) {
        try { restored.setSelectionRange(caret, caret); } catch (e) { /* not a text input */ }
      }
    }
  }

  bindViewEvents();
}

function renderChrome() {
  const connected = state.connected;
  const status = state.status;
  const device = state.device || (state.mode === "demo" ? demo.device : null);

  document.getElementById("miniProduct").textContent = connected && device ? device.product : "No device";
  document.getElementById("miniPort").textContent = connected ? state.port : "—";

  const dot = document.getElementById("miniDot");
  dot.className = "dot " + (!connected ? "" : status && status.locked ? "warn" : "ok");

  const lock = document.getElementById("miniLock");
  lock.textContent = !connected ? "offline" : status && status.locked ? "locked" : "unlocked";
  lock.className = "pill " + (!connected ? "" : status && status.locked ? "warn" : "ok");

  const auth = document.getElementById("miniAuth");
  if (!connected) auth.textContent = "Not connected";
  else if (!status) auth.textContent = "Reading status…";
  else if (status.provisioning) {
    auth.textContent = state.mode === "demo"
      ? "CDC authorized · " + fmtDuration(demo.authUntil - Date.now())
      : "CDC authorized";
  } else auth.textContent = "CDC not authorized";

  const lockButton = document.getElementById("lockBtn");
  lockButton.disabled = !connected || !status || status.locked || state.busy;

  const connectButton = document.getElementById("connectBtn");
  connectButton.textContent = connected ? "Disconnect" : "Connect";
  connectButton.disabled = state.busy;

  const portSelect = document.getElementById("portSelect");
  portSelect.disabled = connected || state.busy;
  if (connected && state.port) {
    // The host may report a port this static sample list does not contain.
    const found = Array.from(portSelect.options).some(function (option) { return option.value === state.port; });
    if (!found) portSelect.add(new Option(state.port, state.port));
    portSelect.value = state.port;
  }

  const modeBadge = document.getElementById("modeBadge");
  modeBadge.textContent = state.mode === "demo" ? "Demo" : "WebView2";
  modeBadge.className = "badge " + (state.mode === "demo" ? "blue" : "ok");
}

/* ======================================================================
   View events
   ====================================================================== */

function bindViewEvents() {
  const addForm = document.getElementById("addForm");
  if (addForm) {
    addForm.addEventListener("submit", submitCredential);
    addForm.addEventListener("input", function () {
      syncCounters(addForm);
      updateASCIIWarning(addForm);
    });
    syncCounters(addForm);
  }

  const totpForm = document.getElementById("totpForm");
  if (totpForm) {
    totpForm.querySelector("#uri").addEventListener("input", function () {
      syncCounters(totpForm);
      const preview = document.getElementById("totpPreview");
      const parsed = parseTOTP(this.value.trim());
      preview.textContent = parsed && parsed.account
        ? "Issuer: " + (parsed.issuer || "—") + " · Account: " + parsed.account
        : "Paste a URI to see the issuer and account.";
    });
    totpForm.addEventListener("submit", submitTOTP);
    syncCounters(totpForm);
  }

  const search = document.getElementById("search");
  if (search) {
    let timer = null;
    search.addEventListener("input", function () {
      const value = this.value;
      clearTimeout(timer);
      timer = setTimeout(function () {
        state.query = value.slice(0, LIMITS.query);
        state.offsets[state.tab] = 0;
        reloadEntries();
      }, 260);
    });
  }
}

function syncCounters(scope) {
  scope.querySelectorAll("[data-limit]").forEach(function (input) {
    const counter = scope.querySelector('[data-count="' + input.id + '"]');
    if (!counter) return;
    const max = Number(input.dataset.limit);
    const used = byteLength(input.value);
    counter.textContent = used + " / " + max;
    counter.classList.toggle("over", used > max);
  });
}

function updateASCIIWarning(scope) {
  const warning = document.getElementById("asciiWarn");
  if (!warning) return;
  const values = ["service", "username", "password", "url", "notes"].map(function (id) {
    const field = scope.querySelector("#" + id);
    return field ? field.value : "";
  });
  warning.classList.toggle("show", values.some(function (value) { return !isASCII(value); }));
}

/* ======================================================================
   Actions
   ====================================================================== */

async function runAction(button, work) {
  if (state.busy) return;
  state.busy = true;
  if (button) {
    button.dataset.label = button.textContent;
    button.textContent = "Working…";
    button.disabled = true;
  }
  try {
    await work();
  } catch (error) {
    log("error", "fail", (error && error.code) || "unknown");
    toastError(error);
  } finally {
    state.busy = false;
    if (button && button.isConnected) {
      button.textContent = button.dataset.label || "Done";
      button.disabled = false;
    }
    renderChrome();
  }
}

async function connect() {
  if (state.busy) return;
  state.busy = true;
  renderChrome();
  try {
    // Demo mode models opening a port. In WebView2 mode the session process
    // already owns the long-lived COM port, so "connect" is a reconnect.
    const result = state.mode === "webview"
      ? await api("reconnect", state.port ? { port: state.port } : {})
      : await api("open", { port: state.port });
    state.connected = true;
    state.port = result.port || state.port;
    state.device = result.device || state.device;
    state.status = await api("status");
    try { state.clock = await api("time.get"); } catch (e) { state.clock = null; }
    await loadEntries();
    log(state.mode === "webview" ? "reconnect" : "open", "ok", state.port);
    toast("Connected", "ok", state.status && state.status.provisioning
      ? "VaultKey on " + state.port
      : "Authorize CDC on the device to manage entries");
  } catch (error) {
    log("connect", "fail", error.message);
    toastError(error);
  } finally {
    state.busy = false;
    render();
  }
}

async function disconnect() {
  if (state.busy) return;
  state.busy = true;
  try {
    if (state.mode === "webview") {
      // Process lifecycle belongs to the host, not to the session protocol.
      hostControl("disconnect");
      log("session.disconnect", "ok", "requested host stop");
    } else {
      await api("close");
      log("close", "ok");
    }
  } catch (error) {
    log("close", "fail", error.message);
  } finally {
    state.connected = false;
    state.status = null;
    state.clock = null;
    state.list = null;
    state.busy = false;
    render();
  }
}

// fetchAll walks the paged list endpoint (max 25 rows per page) so the "all"
// tab can page locally across credentials and TOTP with one shared sequence.
// It mirrors the CLI's fetchAll helper. List is read-only, so repeating the
// call at successive offsets never mutates the device.
async function fetchAll(query) {
  const limit = LIMITS.page_limit;
  const credentials = [];
  const totp = [];
  let credential_total = 0;
  let totp_total = 0;

  const maxPages = Math.ceil(Math.max(LIMITS.credentials, LIMITS.totp) / limit) + 1;
  for (let page = 0; page < maxPages; page++) {
    const result = await api("list", {
      query: query,
      offset: page * limit,
      limit: limit
    });
    credential_total = result.credential_total || 0;
    totp_total = result.totp_total || 0;
    credentials.push.apply(credentials, result.credentials || []);
    totp.push.apply(totp, result.totp || []);
    const credentialsDone = credentials.length >= credential_total || !(result.credentials || []).length;
    const totpDone = totp.length >= totp_total || !(result.totp || []).length;
    if (credentialsDone && totpDone) break;
  }

  return {
    credentials: credentials,
    totp: totp,
    credential_total: credential_total,
    totp_total: totp_total
  };
}

async function loadEntries() {
  if (!state.connected) return;
  if (state.tab === "all") {
    state.list = await fetchAll(state.query);
    return;
  }
  state.list = await api("list", {
    query: state.query,
    offset: state.offsets[state.tab] || 0,
    limit: PAGE_SIZE
  });
}

async function reloadEntries() {
  if (!state.connected) return;
  try {
    await loadEntries();
  } catch (error) {
    if (error.code === "device_locked" || error.code === "provisioning_not_authorized") {
      state.list = null;
    } else {
      toastError(error);
    }
  }
  render();
}

async function refresh(quiet) {
  if (!state.connected) {
    render();
    return;
  }
  try {
    state.status = await api("status");
    try { state.clock = await api("time.get"); } catch (e) { state.clock = null; }
    if (state.status.provisioning) {
      await loadEntries();
    } else {
      state.list = null;
    }
  } catch (error) {
    if (error.code === "connection_closed" || error.code === "not_open") {
      state.connected = false;
      state.status = null;
      state.list = null;
      if (!quiet) toastError(error);
    } else if (!quiet) {
      toastError(error);
    }
  }
  render();
}

async function lockVault() {
  if (!state.connected) return;
  await runAction(document.getElementById("lockBtn"), async function () {
    await api("lock");
    state.status = await api("status");
    state.list = null;
    log("lock", "ok", "authorization revoked");
    toast("Vault locked", "warn", "CDC authorization was revoked. Re-authorize on the device.");
    state.view = "overview";
  });
  render();
}

async function submitCredential(event) {
  event.preventDefault();
  if (!canManage()) {
    toast("Not authorized", "warn", "Unlock the vault and authorize CDC on the device.");
    return;
  }
  const form = event.currentTarget;
  const data = new FormData(form);
  const password = String(data.get("password") || "");
  if (password !== String(data.get("confirm") || "")) {
    toast("Passwords do not match", "warn");
    return;
  }
  const input = {
    service: String(data.get("service") || "").trim(),
    username: String(data.get("username") || ""),
    password: password,
    url: String(data.get("url") || "").trim(),
    notes: String(data.get("notes") || "").trim()
  };
  const problem = validateCredential(input);
  if (problem) {
    toast("Check the form", "warn", problem);
    return;
  }
  await runAction(form.querySelector('button[type="submit"]'), async function () {
    const result = await api("credentials.add", input);
    log("credentials.add", "ok", "entry " + result.entry_id);
    toast("Credential added", "ok", "Entry ID " + result.entry_id);
    form.reset();
    state.view = "entries";
    state.tab = "all";
    state.offsets.all = 0;
  });
  await refresh(true);
}

async function submitTOTP(event) {
  event.preventDefault();
  if (!canManage()) {
    toast("Not authorized", "warn", "Unlock the vault and authorize CDC on the device.");
    return;
  }
  const form = event.currentTarget;
  const uri = String(new FormData(form).get("uri") || "").trim();
  if (!parseTOTP(uri)) {
    toast("Invalid URI", "warn", "It must start with otpauth://totp/");
    return;
  }
  if (byteLength(uri) > LIMITS.totp_uri) {
    toast("URI too long", "warn", "The limit is 1024 bytes.");
    return;
  }
  await runAction(form.querySelector('button[type="submit"]'), async function () {
    const result = await api("totp.add", { uri: uri });
    log("totp.add", "ok", "entry " + result.entry_id);
    toast("TOTP imported", "ok", "Entry ID " + result.entry_id);
    form.reset();
    const preview = document.getElementById("totpPreview");
    if (preview) preview.textContent = "Paste a URI to see the issuer and account.";
    state.view = "entries";
    state.tab = "all";
    state.offsets.all = 0;
  });
  await refresh(true);
}

/* ---------- modals ---------- */

function openModal(html) {
  const root = document.getElementById("modalRoot");
  root.innerHTML = '<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true">' + html + "</div></div>";
  const overlay = document.getElementById("overlay");
  overlay.addEventListener("click", function (event) {
    if (event.target === overlay) closeModal();
  });
  const focusable = root.querySelector("input, button");
  if (focusable) focusable.focus();
}

function closeModal() {
  document.getElementById("modalRoot").innerHTML = "";
}

function deleteModal(button) {
  const type = button.dataset.type;
  const id = button.dataset.id;
  const label = button.dataset.label;
  openModal(
    '<div class="modal-head"><div><h2>Delete entry</h2><p>' + esc(type) + " · ID " + esc(id) + "</p></div>" +
      '<button class="icon-btn" data-action="modal-close" aria-label="Close">' + icons.close + "</button></div>" +
    '<div class="modal-body"><div class="danger-box">' + icons.warn +
      "<div>This permanently removes <strong>" + esc(label) + "</strong> from the device. " +
      "The deletion cannot be undone.</div></div></div>" +
    '<div class="modal-foot">' +
      '<button class="btn btn-ghost" data-action="modal-close">Cancel</button>' +
      '<button class="btn btn-danger" id="confirmDelete">Delete entry</button>' +
    "</div>"
  );
  document.getElementById("confirmDelete").addEventListener("click", async function () {
    await runAction(this, async function () {
      await api("delete", { type: type, id: Number(id) });
      log("delete", "ok", type + " " + id);
      toast("Entry deleted", "ok", type + " " + id);
      closeModal();
      state.offsets[state.tab] = 0;
    });
    await refresh(true);
  });
}

function replaceModal(button) {
  const id = Number(button.dataset.id);
  const label = button.dataset.label;
  openModal(
    '<div class="modal-head"><div><h2>Replace credential</h2><p>ID ' + esc(id) + " · full replacement</p></div>" +
      '<button class="icon-btn" data-action="modal-close" aria-label="Close">' + icons.close + "</button></div>" +
    '<form class="form" id="replaceForm" autocomplete="off">' +
      '<div class="notice" style="margin:-20px -20px 0;border-bottom:1px solid var(--border)">' + icons.info +
        "<span>The device does not return usernames, URLs, notes, or passwords. Every field below replaces the stored value; " +
        "leaving a field empty clears it.</span></div>" +
      '<div class="form-grid">' +
        '<div class="field"><label for="r-service">Service <span class="req">*</span></label>' +
          '<input class="input" id="r-service" name="service" value="' + esc(label) + '" required></div>' +
        '<div class="field"><label for="r-username">Username</label><input class="input" id="r-username" name="username"></div>' +
        '<div class="field"><label for="r-password">Password <span class="req">*</span></label>' +
          '<div class="pw-wrap"><input class="input" id="r-password" name="password" type="password">' +
          '<button type="button" class="pw-toggle" data-action="toggle-pw" data-target="r-password">Show</button></div></div>' +
        '<div class="field"><label for="r-url">URL</label><input class="input" id="r-url" name="url"></div>' +
        '<div class="field full"><label for="r-notes">Notes</label><textarea class="input" id="r-notes" name="notes"></textarea></div>' +
      "</div>" +
      '<div class="modal-foot" style="margin:0 -20px -20px;padding:14px 20px">' +
        '<button class="btn btn-ghost" type="button" data-action="modal-close">Cancel</button>' +
        '<button class="btn btn-primary" type="submit">Replace entry</button>' +
      "</div>" +
    "</form>"
  );

  const form = document.getElementById("replaceForm");
  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    const data = new FormData(form);
    const input = {
      id: id,
      service: String(data.get("service") || "").trim(),
      username: String(data.get("username") || ""),
      password: String(data.get("password") || ""),
      url: String(data.get("url") || "").trim(),
      notes: String(data.get("notes") || "").trim()
    };
    const problem = validateCredential(input);
    if (problem) {
      toast("Check the form", "warn", problem);
      return;
    }
    await runAction(form.querySelector('button[type="submit"]'), async function () {
      const result = await api("credentials.update", input);
      log("credentials.update", "ok", "entry " + result.entry_id);
      toast("Credential replaced", "ok", "Entry ID " + result.entry_id);
      closeModal();
    });
    await refresh(true);
  });
}

/* ======================================================================
   Delegated events
   ====================================================================== */

document.addEventListener("click", function (event) {
  const target = event.target.closest("[data-action]");
  if (!target) return;
  const action = target.dataset.action;

  switch (action) {
    case "connect":
      if (state.connected) disconnect(); else connect();
      break;
    case "go-add":
      state.view = "add";
      render();
      break;
    case "go-totp":
      state.view = "totp";
      render();
      break;
    case "go-entries":
      state.view = "entries";
      state.offsets[state.tab] = 0;
      reloadEntries();
      break;
    case "goto-activity":
      state.view = "activity";
      render();
      break;
    case "lock":
      lockVault();
      break;
    case "demo-unlock":
      demo.locked = false;
      demo.authUntil = Date.now() + AUTH_WINDOW_MS;
      log("demo.unlock", "ok", "simulated PIN + CDC authorization");
      toast("Demo device unlocked", "ok", "CDC authorized for 5 minutes");
      refresh(true);
      break;
    case "demo-authorize":
      if (demo.locked) demo.locked = false;
      demo.authUntil = Date.now() + AUTH_WINDOW_MS;
      log("demo.authorize", "ok", "5 minutes");
      toast("CDC authorized", "ok", "Demo window extended by 5 minutes");
      refresh(true);
      break;
    case "demo-expire":
      demo.authUntil = Date.now() - 1;
      log("demo.expire", "warn", "authorization expired");
      toast("Authorization expired", "warn", "Management commands now fail with exit 5");
      refresh(true);
      break;
    case "demo-unplug":
      demo.authUntil = 0; // unplugging drops DTR and revokes provisioning
      state.connected = false;
      state.status = null;
      state.clock = null;
      state.list = null;
      log("demo.unplug", "warn", "simulated cable removal");
      toast("Device unplugged", "warn", "Plug in, then authorize CDC again");
      render();
      break;
    case "reconnect":
      runAction(target, async function () {
        const result = await api("reconnect", state.port ? { port: state.port } : {});
        state.port = result.port || state.port;
        state.device = result.device || state.device;
        state.connected = true;
        state.status = await api("status");
        try { state.clock = await api("time.get"); } catch (e) { state.clock = null; }
        if (state.status.provisioning) {
          await loadEntries();
        } else {
          state.list = null;
        }
        log("reconnect", "ok", state.port);
        toast("Reconnected", "ok", state.status.provisioning
          ? "VaultKey on " + state.port
          : "Authorize CDC on the device to manage entries");
        render();
      });
      break;
    case "toggle-pw": {
      const field = document.getElementById(target.dataset.target);
      if (field) {
        field.type = field.type === "password" ? "text" : "password";
        target.textContent = field.type === "password" ? "Show" : "Hide";
      }
      break;
    }
    case "tab":
      state.tab = target.dataset.tab;
      state.offsets[state.tab] = state.offsets[state.tab] || 0;
      reloadEntries();
      break;
    case "prev-page":
      state.offsets[state.tab] = Math.max(0, (state.offsets[state.tab] || 0) - PAGE_SIZE);
      reloadEntries();
      break;
    case "next-page":
      state.offsets[state.tab] = (state.offsets[state.tab] || 0) + PAGE_SIZE;
      reloadEntries();
      break;
    case "delete":
      deleteModal(target);
      break;
    case "replace":
      replaceModal(target);
      break;
    case "modal-close":
      closeModal();
      break;
  }
});

document.querySelectorAll(".nav button").forEach(function (button) {
  button.addEventListener("click", function () {
    state.view = button.dataset.view;
    if (state.view === "entries") reloadEntries();
    else render();
  });
});

document.addEventListener("keydown", function (event) {
  if (event.key === "Escape") {
    closeModal();
  }
});

/* ======================================================================
   Clock / authorization ticker
   ====================================================================== */

let expiredNotified = false;

setInterval(function () {
  if (state.mode !== "demo" || !state.connected) return;
  const countdown = document.getElementById("authCountdown");
  if (countdown) countdown.textContent = fmtDuration(demo.authUntil - Date.now());

  if (!expiredNotified && demo.authUntil <= Date.now() && state.status && state.status.provisioning) {
    expiredNotified = true;
    demo.authUntil = 0;
    log("authorization.expired", "warn", "5-minute window ended");
    toast("Authorization expired", "warn", "Re-authorize on the device to manage entries.");
    if (state.status) {
      state.status.provisioning = false;
      delete state.status.credentials;
      delete state.status.totp;
    }
    state.list = null;
    if (state.view === "add" || state.view === "totp") {
      // Keep whatever is typed so re-authorizing does not force a retype,
      // but disable submission until canManage() is true again.
      renderChrome();
      const pill = document.querySelector("#view .card-head .pill");
      if (pill) {
        pill.className = "pill warn";
        pill.textContent = "unlock + authorize required";
      }
      document.querySelectorAll('#view [data-limit], #view form button[type="submit"]').forEach(function (node) {
        node.disabled = true;
      });
    } else {
      render();
    }
  }
  if (demo.authUntil > Date.now()) {
    expiredNotified = false;
  }
}, 1000);

/* ======================================================================
   Boot
   ====================================================================== */

async function boot() {
  if (state.mode === "webview") {
    window.chrome.webview.addEventListener("message", handleHostMessage);
    const capabilitiesResult = await api("capabilities").catch(function () { return null; });
    if (capabilitiesResult) log("capabilities", "ok", "session protocol 1");
    try {
      const hello = await api("hello");
      state.connected = true;
      state.port = hello.port || state.port;
      state.device = hello.device || state.device;
      log("hello", "ok", state.port);
      await refresh(true);
    } catch (error) {
      log("hello", "fail", error.message);
      toast("Session not ready", "warn", "Start the vaultkey session in the host and reconnect.");
      render();
    }
    return;
  }

  await connect();
}

boot();
</script>
